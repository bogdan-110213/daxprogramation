<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Editor Online - Moderno</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #fff;
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .python-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3776ab 0%, #ffd43b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 1.5em;
        }

        .status {
            color: #fff;
            font-size: 0.9em;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .status.loading {
            background: #f39c12;
        }

        .status.ready {
            background: #27ae60;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 600px;
        }

        .editor-panel, .output-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            color: #fff;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-wrapper {
            flex: 1;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-size: 14px;
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        .output-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
        }

        .output-line {
            margin-bottom: 5px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-line.error {
            color: #ff6b6b;
        }

        .output-line.success {
            color: #51cf66;
        }

        .output-line.info {
            color: #74c0fc;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .run-btn {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
        }

        .run-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }

        .run-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .examples-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .examples-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .examples-dropdown {
            position: relative;
        }

        .examples-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 10px 0;
            min-width: 200px;
            display: none;
            z-index: 1000;
            margin-top: 5px;
        }

        .examples-menu.show {
            display: block;
        }

        .examples-menu button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            background: transparent;
            color: #fff;
            border-radius: 0;
            text-align: left;
        }

        .examples-menu button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .editor-panel, .output-panel {
                height: 400px;
            }

            h1 {
                font-size: 1.5em;
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            text-align: center;
            color: #fff;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Cargando Python en el navegador...</p>
            <p style="font-size: 0.8em; margin-top: 10px; opacity: 0.7;">Esto puede tomar unos segundos</p>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>
                <div class="python-logo">Py</div>
                Python Editor Online
            </h1>
            <div class="status loading" id="status">Cargando...</div>
        </header>

        <div class="editor-container">
            <div class="editor-panel">
                <div class="panel-header">
                    <span>Editor</span>
                    <span style="font-size: 0.8em; opacity: 0.7;">Python 3.11</span>
                </div>
                <div class="editor-wrapper">
                    <textarea id="codeEditor"># Escribe tu código Python aquí
# Ejemplo básico:
print("¡Hola desde Python en el navegador!")

# Variables y operaciones
nombre = "Mundo"
mensaje = f"Hola, {nombre}!"
print(mensaje)

# Listas y bucles
numeros = [1, 2, 3, 4, 5]
cuadrados = [x**2 for x in numeros]
print(f"Cuadrados: {cuadrados}")

# Funciones
def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

print(f"Factorial de 5: {factorial(5)}")
</textarea>
                </div>
            </div>

            <div class="output-panel">
                <div class="panel-header">
                    <span>Salida</span>
                    <button class="clear-btn" style="padding: 5px 15px; font-size: 0.8em;" onclick="clearOutput()">Limpiar</button>
                </div>
                <div class="output-content" id="output">
                    <div class="output-line info">La salida aparecerá aquí...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="run-btn" id="runBtn" onclick="runCode()" disabled>
                ▶ Ejecutar
            </button>
            <button class="clear-btn" onclick="clearEditor()">
                🗑️ Limpiar Editor
            </button>
            <div class="examples-dropdown">
                <button class="examples-btn" onclick="toggleExamples()">
                    📚 Ejemplos
                </button>
                <div class="examples-menu" id="examplesMenu">
                    <button onclick="loadExample('basic')">Básico</button>
                    <button onclick="loadExample('loops')">Bucles</button>
                    <button onclick="loadExample('functions')">Funciones</button>
                    <button onclick="loadExample('classes')">Clases</button>
                    <button onclick="loadExample('data')">Estructuras de datos</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pyodide = null;
        let editor = null;

        // Inicializar CodeMirror
        document.addEventListener('DOMContentLoaded', function() {
            editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                mode: 'python',
                theme: 'dracula',
                lineNumbers: true,
                matchBrackets: true,
                autoCloseBrackets: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: true,
                extraKeys: {
                    'Ctrl-Enter': runCode,
                    'Cmd-Enter': runCode
                }
            });
        });

        // Cargar Pyodide
        async function loadPyodide() {
            try {
                pyodide = await loadPyodide();
                document.getElementById('status').textContent = 'Listo';
                document.getElementById('status').className = 'status ready';
                document.getElementById('runBtn').disabled = false;
                document.getElementById('loadingOverlay').classList.add('hidden');
                appendOutput('Python cargado exitosamente. ¡Escribe y ejecuta tu código!', 'success');
            } catch (error) {
                console.error('Error al cargar Pyodide:', error);
                document.getElementById('status').textContent = 'Error';
                appendOutput('Error al cargar Python. Recarga la página.', 'error');
            }
        }

        // Ejecutar código Python
        async function runCode() {
            if (!pyodide) {
                appendOutput('Python aún no está cargado. Espera unos segundos...', 'error');
                return;
            }

            const code = editor.getValue();
            const runBtn = document.getElementById('runBtn');
            
            runBtn.disabled = true;
            runBtn.textContent = '⏳ Ejecutando...';
            
            clearOutput();
            appendOutput('Ejecutando código...', 'info');

            try {
                // Redirigir stdout
                pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
                `);

                // Ejecutar código del usuario
                await pyodide.runPythonAsync(code);

                // Capturar salida
                const stdout = pyodide.runPython('sys.stdout.getvalue()');
                const stderr = pyodide.runPython('sys.stderr.getvalue()');

                if (stdout) {
                    stdout.split('\n').forEach(line => {
                        if (line.trim()) {
                            appendOutput(line);
                        }
                    });
                }

                if (stderr) {
                    stderr.split('\n').forEach(line => {
                        if (line.trim()) {
                            appendOutput(line, 'error');
                        }
                    });
                }

                if (!stdout && !stderr) {
                    appendOutput('Código ejecutado sin salida.', 'info');
                }

                appendOutput('✓ Ejecución completada', 'success');

            } catch (error) {
                appendOutput(`Error: ${error.message}`, 'error');
            }

            runBtn.disabled = false;
            runBtn.textContent = '▶ Ejecutar';
        }

        // Funciones de utilidad
        function appendOutput(text, type = '') {
            const output = document.getElementById('output');
            const line = document.createElement('div');
            line.className = `output-line ${type}`;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            const output = document.getElementById('output');
            output.innerHTML = '';
        }

        function clearEditor() {
            editor.setValue('');
            clearOutput();
            appendOutput('Editor limpiado. Escribe tu código Python...', 'info');
        }

        function toggleExamples() {
            const menu = document.getElementById('examplesMenu');
            menu.classList.toggle('show');
        }

        // Cerrar menú de ejemplos al hacer clic fuera
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('examplesMenu');
            const btn = document.querySelector('.examples-btn');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('show');
            }
        });

        // Ejemplos de código
        const examples = {
            basic: `# Ejemplo básico
print("¡Hola, Python!")

# Variables
nombre = "Ana"
edad = 25
print(f"Nombre: {nombre}, Edad: {edad}")

# Operaciones matemáticas
a = 10
b = 3
print(f"Suma: {a + b}")
print(f"Resta: {a - b}")
print(f"Multiplicación: {a * b}")
print(f"División: {a / b}")
print(f"Potencia: {a ** b}")`,

            loops: `# Ejemplo de bucles
# Bucle for
print("Números del 1 al 5:")
for i in range(1, 6):
    print(f"  {i}")

# Bucle while
print("\\nCuenta regresiva:")
n = 5
while n > 0:
    print(f"  {n}")
    n -= 1
print("  ¡Despegue!")

# Bucle con lista
frutas = ["manzana", "banana", "cereza"]
print("\\nFrutas:")
for fruta in frutas:
    print(f"  - {fruta}")`,

            functions: `# Ejemplo de funciones
def saludar(nombre):
    return f"¡Hola, {nombre}!"

def sumar(a, b):
    return a + b

def es_par(numero):
    return numero % 2 == 0

# Usar funciones
print(saludar("Carlos"))
print(f"3 + 4 = {sumar(3, 4)}")
print(f"¿7 es par? {es_par(7)}")
print(f"¿8 es par? {es_par(8)}")

# Función con parámetros por defecto
def potencia(base, exponente=2):
    return base ** exponente

print(f"5^2 = {potencia(5)}")
print(f"2^3 = {potencia(2, 3)}")`,

            classes: `# Ejemplo de clases
class Persona:
    def __init__(self, nombre, edad):
        self.nombre = nombre
        self.edad = edad
    
    def presentarse(self):
        return f"Soy {self.nombre}, tengo {self.edad} años"
    
    def cumplir_anios(self):
        self.edad += 1
        return f"¡Ahora tengo {self.edad} años!"

class Estudiante(Persona):
    def __init__(self, nombre, edad, curso):
        super().__init__(nombre, edad)
        self.curso = curso
    
    def estudiar(self):
        return f"Estudiando {self.curso}"

# Crear objetos
persona = Persona("Juan", 30)
print(persona.presentarse())
print(persona.cumplir_anios())

estudiante = Estudiante("María", 20, "Matemáticas")
print(estudiante.presentarse())
print(estudiante.estudiar())`,

            data: `# Estructuras de datos
# Listas
numeros = [1, 2, 3, 4, 5]
print(f"Lista: {numeros}")
print(f"Primero: {numeros[0]}")
print(f"Último: {numeros[-1]}")
print(f"Rebanada: {numeros[1:4]}")

# Diccionarios
persona = {
    "nombre": "Pedro",
    "edad": 28,
    "ciudad": "Madrid"
}
print(f"\\nDiccionario: {persona}")
print(f"Nombre: {persona['nombre']}")
print(f"Edad: {persona.get('edad', 'No disponible')}")

# Conjuntos
colores = {"rojo", "verde", "azul", "rojo"}
print(f"\\nConjunto: {colores}")

# Tuplas (inmutables)
coordenadas = (10, 20)
print(f"\\nCoordenadas: {coordenadas}")
print(f"X: {coordenadas[0]}, Y: {coordenadas[1]}")`
        };

        function loadExample(name) {
            if (examples[name]) {
                editor.setValue(examples[name]);
                clearOutput();
                appendOutput(`Ejemplo "${name}" cargado. Haz clic en Ejecutar.`, 'info');
            }
            document.getElementById('examplesMenu').classList.remove('show');
        }

        // Iniciar carga de Pyodide
        loadPyodide();
    </script>
</body>
</html>
